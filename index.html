<h1>Plex Mirror</h1>
<p>Plex Mirror is a personal tool that copies its owner's Plex music playlists into the owner's own YouTube playlists, using official music videos.</p>
<p>It is not a public service. It only runs on the owner's computer and only acts on the YouTube account that signs in to it.</p>
